name: Build Motoroll TV preview

on:
  push:
    branches: [ feature/motoroll-tv-port ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-tv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build TV preview APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload TV preview APK
        uses: actions/upload-artifact@v4
        with:
          name: Motoroll-TV-preview-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
