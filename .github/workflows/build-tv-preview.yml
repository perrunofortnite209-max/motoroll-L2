name: Build Motoroll TV

on:
  push:
    branches: [ feature/motoroll-tv-port ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Verify TV-only package
        shell: bash
        run: |
          set -euo pipefail
          grep -q "applicationId 'com.motoroll.tv'" app/build.gradle
          grep -q 'android:name="com.motoroll.home.TvActivity"' app/src/main/AndroidManifest.xml
          ! grep -q 'android:name="com.motoroll.home.MainActivity"' app/src/main/AndroidManifest.xml
      - name: Read TV version
        id: tv-version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n "s/.*versionName '\\([^']*\\)'.*/\\1/p" app/build.gradle | head -n1)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=motoroll-tv-v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build TV APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Decode permanent signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, base64, sys
          raw=os.environ.get("KEYSTORE_BASE64","").strip()
          if not raw: sys.exit("Missing KEYSTORE_BASE64")
          raw=raw.replace("-----BEGIN CERTIFICATE-----","").replace("-----END CERTIFICATE-----","")
          raw=re.sub(r"[^A-Za-z0-9+/=]","",raw)
          raw += "="*((-len(raw))%4)
          data=base64.b64decode(raw)
          if len(data)<100 or data[0]!=0x30: sys.exit("Invalid PKCS12")
          path=os.path.join(os.environ["RUNNER_TEMP"],"motoroll-tv.p12")
          open(path,"wb").write(data)
          PY
          test -n "${KEYSTORE_PASSWORD:-}" && test -n "${KEY_ALIAS:-}"
          keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/motoroll-tv.p12" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
      - name: Sign and verify TV APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${KEY_PASSWORD:-}"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          OUT="app/build/outputs/apk/debug/MotorollTV.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/motoroll-tv.p12" --ks-type PKCS12 \
            --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD --out "$OUT" "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$OUT"
          test -s "$OUT"
      - name: Upload signed TV APK
        uses: actions/upload-artifact@v4
        with:
          name: Motoroll-TV-${{ steps.tv-version.outputs.version }}
          path: app/build/outputs/apk/debug/MotorollTV.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish TV release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tv-version.outputs.tag }}
          name: Motoroll TV ${{ steps.tv-version.outputs.version }}
          body: |
            Versión independiente de Motoroll TV.
            Canal de actualizaciones separado del launcher móvil Motoroll Home.
            - Paquete separado: com.motoroll.tv.
            - Solo pantalla de inicio para Android TV / Google TV.
            - Sin bienvenida ni actividad de Motoroll Home móvil.
            - Firma permanente para permitir futuras actualizaciones sobre esta instalación.
          files: app/build/outputs/apk/debug/MotorollTV.apk
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: false
