
name: Build Motoroll Home

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Verify launcher source
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/java/com/motoroll/home/MainActivity.java
          grep -q '^package com\.motoroll\.home;' app/src/main/java/com/motoroll/home/MainActivity.java
          grep -q 'public class MainActivity' app/src/main/java/com/motoroll/home/MainActivity.java

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify MainActivity
        shell: bash
        run: |
          set -euo pipefail

          CLASS_FILE="$(find app/build/intermediates -type f \
            -name 'MainActivity.class' \
            -path '*com/motoroll/home/*' -print -quit)"

          if [ -z "$CLASS_FILE" ]; then
            echo "ERROR: MainActivity.class no fue generado."
            exit 1
          fi

          echo "MainActivity compilada: $CLASS_FILE"
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Decode permanent signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: Falta el secreto KEYSTORE_BASE64."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" \
            | tr -d '\r\n\t ' \
            | sed 's/-----BEGIN CERTIFICATE-----//g; s/-----END CERTIFICATE-----//g' \
            | base64 --decode > "$RUNNER_TEMP/motoroll-release.p12"

          if [ ! -s "$RUNNER_TEMP/motoroll-release.p12" ]; then
            echo "ERROR: El archivo PKCS12 quedó vacío."
            exit 1
          fi

          echo "Keystore decodificado correctamente."

      - name: Sign APK permanently
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${KEY_ALIAS:-}" ] || \
             [ -z "${KEY_PASSWORD:-}" ]; then
            echo "ERROR: Falta uno o más secretos de firma."
            exit 1
          fi

          APK_UNSIGNED="app/build/outputs/apk/debug/app-debug.apk"
          APK_SIGNED="app/build/outputs/apk/debug/MotorollHome.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          test -s "$APK_UNSIGNED"

          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/motoroll-release.p12" \
            --ks-type PKCS12 \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$APK_SIGNED" \
            "$APK_UNSIGNED"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK_SIGNED"

          test -s "$APK_SIGNED"
          echo "APK firmada y verificada correctamente."

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: MotorollHome-release-apk
          path: app/build/outputs/apk/debug/MotorollHome.apk
          if-no-files-found: error
          retention-days: 30
