name: Build Motoroll Home

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Verify launcher source
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/java/com/motoroll/home/MainActivity.java
          grep -q '^package com\.motoroll\.home;' app/src/main/java/com/motoroll/home/MainActivity.java
          grep -q 'public class MainActivity' app/src/main/java/com/motoroll/home/MainActivity.java
          grep -q 'addSquareWeatherWidget' app/src/main/java/com/motoroll/home/MainActivity.java
          grep -q 'class SwipeRootLayout' app/src/main/java/com/motoroll/home/MainActivity.java
          grep -q 'chooseWeatherShape' app/src/main/java/com/motoroll/home/MainActivity.java
          grep -q 'chooseHomeNoteStyle' app/src/main/java/com/motoroll/home/MainActivity.java
          grep -q 'Posición independiente del clima' app/src/main/java/com/motoroll/home/MainActivity.java
          grep -q 'weatherPosition == 2' app/src/main/java/com/motoroll/home/MainActivity.java
          grep -q 'showCustomizationCategory' app/src/main/java/com/motoroll/home/MainActivity.java
          grep -q 'clockWeatherFrame' app/src/main/java/com/motoroll/home/MainActivity.java
          grep -q 'weatherParams.setMarginEnd' app/src/main/java/com/motoroll/home/MainActivity.java

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify MainActivity
        shell: bash
        run: |
          set -euo pipefail
          CLASS_FILE="$(find app/build/intermediates -type f -name 'MainActivity.class' -path '*com/motoroll/home/*' -print -quit)"
          if [ -z "$CLASS_FILE" ]; then
            echo "ERROR: MainActivity.class no fue generado."
            exit 1
          fi
          echo "MainActivity compilada: $CLASS_FILE"
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Decode and validate permanent signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          import base64
          import sys

          raw = os.environ.get("KEYSTORE_BASE64", "")
          if not raw.strip():
              sys.exit("ERROR: Falta KEYSTORE_BASE64.")

          raw = raw.replace("-----BEGIN CERTIFICATE-----", "")
          raw = raw.replace("-----END CERTIFICATE-----", "")
          clean = re.sub(r"[^A-Za-z0-9+/=]", "", raw)
          if not clean:
              sys.exit("ERROR: KEYSTORE_BASE64 no contiene datos Base64.")
          clean += "=" * ((-len(clean)) % 4)

          try:
              decoded = base64.b64decode(clean, validate=False)
          except Exception as exc:
              sys.exit("ERROR: No se pudo decodificar KEYSTORE_BASE64: " + str(exc))

          if len(decoded) < 100 or decoded[0] != 0x30:
              sys.exit("ERROR: El contenido decodificado no parece un PKCS12 válido.")

          output = os.path.join(os.environ["RUNNER_TEMP"], "motoroll-release.p12")
          with open(output, "wb") as f:
              f.write(decoded)

          print("Keystore decodificado. Tamaño:", len(decoded), "bytes")
          PY

          if [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ]; then
            echo "ERROR: Falta KEYSTORE_PASSWORD o KEY_ALIAS."
            exit 1
          fi

          keytool -list -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/motoroll-release.p12" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          echo "PKCS12 y contraseña verificados correctamente."

      - name: Sign APK permanently
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "ERROR: Falta uno o más secretos de firma."
            exit 1
          fi

          APK_UNSIGNED="app/build/outputs/apk/debug/app-debug.apk"
          APK_SIGNED="app/build/outputs/apk/debug/MotorollHome.apk"
          KEYSTORE="$RUNNER_TEMP/motoroll-release.p12"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          test -s "$APK_UNSIGNED"
          test -s "$KEYSTORE"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-type PKCS12 \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$APK_SIGNED" \
            "$APK_UNSIGNED"

          "$APKSIGNER" verify --verbose --print-certs "$APK_SIGNED"
          test -s "$APK_SIGNED"
          echo "APK firmada y verificada correctamente."

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: MotorollHome-release-apk
          path: app/build/outputs/apk/debug/MotorollHome.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish versioned GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.3.14
          name: Motoroll Home 3.3.14
          body: |
            Nuevas opciones de personalización:
            - Widget del clima circular, cuadrado o con esquinas suaves.
            - Posición independiente a la izquierda o derecha del reloj, o debajo.
            - El reloj conserva su alineación y ambos elementos reservan espacio para evitar superposiciones.
            - Notas con color y tamaño configurables, colocadas en una línea propia.
            - El widget del clima se ancla al borde izquierdo o derecho sin alterar la alineación independiente del reloj.
            - Personalización se reorganiza en seis categorías para encontrar los ajustes sin recorrer una lista larga.
            - Se conservan las opciones, preferencias guardadas, paginación horizontal, fondos y funciones anteriores.
          files: app/build/outputs/apk/debug/MotorollHome.apk
          fail_on_unmatched_files: true
          overwrite_files: true
