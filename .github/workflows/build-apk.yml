
name: Build Motoroll Home 3.0.2 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Verify launcher source
        shell: bash
        run: |
          test -f app/src/main/java/com/motoroll/home/MainActivity.java
          grep -q '^package com\.motoroll\.home;' app/src/main/java/com/motoroll/home/MainActivity.java
          grep -q 'public class MainActivity' app/src/main/java/com/motoroll/home/MainActivity.java

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify MainActivity
        shell: bash
        run: |
          CLASS_FILE="$(find app/build/intermediates -type f -name 'MainActivity.class' -path '*com/motoroll/home/*' -print -quit)"
          if [ -z "$CLASS_FILE" ]; then
            echo "ERROR: MainActivity.class no fue generado."
            exit 1
          fi
          echo "MainActivity compilada: $CLASS_FILE"
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MotorollHome-3.0.2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
