plugins {
    id 'com.android.application'
}

android {
    namespace 'com.motoroll.home'
    compileSdk 36

    defaultConfig {
        applicationId 'com.motoroll.home'
        minSdk 26
        targetSdk 35
        versionCode 13
        versionName '3.3.3'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
